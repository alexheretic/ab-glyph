[package]
name = "dev"
version = "0.1.0"
description = "Tests, examples & benchmarks avoiding dependency feature bleed"
edition = "2021"
publish = false

[dependencies]
ab_glyph = { path = "../glyph" }
ab_glyph_rasterizer = { path = "../rasterizer" }
approx = "0.5"
blake3 = "1.8.7"
criterion = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[[bench]]
name = "rasterize"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "layout_draw"
harness = false

[[bench]]
name = "font_method"
harness = false
